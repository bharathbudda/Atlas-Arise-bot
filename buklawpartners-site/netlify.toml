# Netlify config for buklawpartners.com.
# In Netlify, set Base directory = buklawpartners-site. Everything else is read from here.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
